name: Ofertas diarias

on:
  schedule:
    - cron: "0 11 * * *"   # 08:00 en Santiago (horario de verano, UTC-3)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo probar (no manda correo)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

      # Recupera la lista de ofertas ya enviadas en ejecuciones anteriores.
      - uses: actions/cache/restore@v4
        with:
          path: data/seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: Buscar, puntuar y enviar
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROFILE_TEXT: ${{ secrets.PROFILE_TEXT }}
          MIN_SALARY_CLP: ${{ vars.MIN_SALARY_CLP || '1700000' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m job_agent ${{ inputs.dry_run && '--dry-run' || '' }}

      - uses: actions/cache/save@v4
        if: success()
        with:
          path: data/seen.json
          key: seen-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report
          path: out/report.html
          retention-days: 7
